services:
  postgres:
    build: ./database
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  go-service:
    build: ./go-service
    container_name: go-service
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://apidatatest:nueva_contraseña@postgres:5432/postgres?sslmode=disable
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=10
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  java-service:
    build: ./java-service
    container_name: java-service
    environment:
      - PORT=8081
      - DATABASE_URL=jdbc:postgresql://postgres:5432/postgres
      - DATABASE_USER=apidatatest
      - DATABASE_PASSWORD=nueva_contraseña
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=10
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./analitics/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - go-service
      - java-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./analitics/grafana/provisioning:/etc/grafana/provisioning
      - ./analitics/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # No arranca con `up`: se lanza a demanda con `docker compose run --rm k6`.
  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles: ["stress"]
    volumes:
      - ./stress/scenarios:/scripts:ro
    environment:
      - TARGETS=${TARGETS:-go,java}
      - USE_DATABASE=${USE_DATABASE:-false}
      - VUS=${VUS:-10}
      - DURATION=${DURATION:-30s}
    command: ["run", "/scripts/data.js"]
