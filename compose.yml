# Techo global de logs: máximo 5 archivos de 100 MB por contenedor (500 MB tope).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# Versiones fijadas: con :latest dos corridas en días distintos podían medir
# binarios distintos sin que nada lo avisara.
services:
  postgres:
    build: ./database
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  go-service:
    build: ./go-service
    container_name: go-service
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://apidatatest:nueva_contraseña@postgres:5432/postgres?sslmode=disable
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=10
      # Techo blando de memoria para el runtime de Go, que no lee el límite
      # del contenedor por sí solo. Es ~90 % de SERVICE_MEMORY: si se cambia
      # uno, hay que mover el otro. Java hace lo mismo con MaxRAMPercentage.
      - GOMEMLIMIT=${GO_MEMLIMIT:-460MiB}
    ports:
      - "8080:8080"
    # Mismo techo de CPU y RAM que java-service: sin esto la comparación
    # mide quién pudo acaparar más máquina, no quién es más eficiente.
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPUS:-2}"
          memory: "${SERVICE_MEMORY:-512m}"
    # Marca el servicio como healthy en cuanto /metrics responde. Sirve para
    # medir el arranque desde fuera (tiempo hasta healthy) y para que
    # Prometheus no raspe antes de tiempo. start_interval sondea cada segundo
    # solo mientras arranca; después baja a uno cada 30 s para no meter
    # carga en el proceso medido.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  java-service:
    build: ./java-service
    container_name: java-service
    environment:
      - PORT=8081
      - DATABASE_URL=jdbc:postgresql://postgres:5432/postgres
      - DATABASE_USER=apidatatest
      - DATABASE_PASSWORD=nueva_contraseña
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=10
      # Por defecto la JVM solo usa el 25 % del límite del contenedor para el
      # heap. Con 75 % aprovecha el mismo techo que Go, dejando margen para
      # metaspace, hilos y buffers fuera del heap.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPUS:-2}"
          memory: "${SERVICE_MEMORY:-512m}"
    # Mismo healthcheck que go-service.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Buzón para k6: vive 30 segundos y muere, así que Prometheus nunca alcanza
  # a rasparlo. k6 empuja aquí y Prometheus lo lee de este contenedor.
  # Sin volumen a propósito: cada corrida reemplaza a la anterior.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    container_name: pushgateway
    ports:
      - "9091:9091"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./analitics/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      go-service:
        condition: service_healthy
      java-service:
        condition: service_healthy
      pushgateway:
        condition: service_started
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin1
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    volumes:
      - ./analitics/grafana/provisioning:/etc/grafana/provisioning
      - ./analitics/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    logging: *default-logging

  # No arranca con `up`: se lanza a demanda, normalmente con ./stress/stress.sh
  # Estos defectos son los mismos que usa el script y el escenario de k6.
  k6:
    image: grafana/k6:2.3.0
    container_name: k6
    profiles: ["stress"]
    volumes:
      - ./stress/scenarios:/scripts:ro
    environment:
      - TARGETS=${TARGETS:-go,java}
      - USE_DATABASE=${USE_DATABASE:-false}
      - VUS=${VUS:-20}
      - MODE=${MODE:-requests}
      - DURATION=${DURATION:-30s}
      - REQUESTS=${REQUESTS:-10000}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}
    command: ["run", "/scripts/data.js"]
    logging: *default-logging
