# Techo global de logs: máximo 5 archivos de 100 MB por contenedor (500 MB tope).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    build: ./database
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  go-service:
    build: ./go-service
    container_name: go-service
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://apidatatest:nueva_contraseña@postgres:5432/postgres?sslmode=disable
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=10
    ports:
      - "8080:8080"
    # Mismo techo de CPU y RAM que java-service: sin esto la comparación
    # mide quién pudo acaparar más máquina, no quién es más eficiente.
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPUS:-2}"
          memory: "${SERVICE_MEMORY:-512m}"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  java-service:
    build: ./java-service
    container_name: java-service
    environment:
      - PORT=8081
      - DATABASE_URL=jdbc:postgresql://postgres:5432/postgres
      - DATABASE_USER=apidatatest
      - DATABASE_PASSWORD=nueva_contraseña
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=10
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "${SERVICE_CPUS:-2}"
          memory: "${SERVICE_MEMORY:-512m}"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Buzón para k6: vive 30 segundos y muere, así que Prometheus nunca alcanza
  # a rasparlo. k6 empuja aquí y Prometheus lo lee de este contenedor.
  # Sin volumen a propósito: cada corrida reemplaza a la anterior.
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./analitics/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - go-service
      - java-service
      - pushgateway
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin1
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    volumes:
      - ./analitics/grafana/provisioning:/etc/grafana/provisioning
      - ./analitics/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    logging: *default-logging

  # No arranca con `up`: se lanza a demanda, normalmente con ./stress/stress.sh
  # Estos defectos son los mismos que usa el script y el escenario de k6.
  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles: ["stress"]
    volumes:
      - ./stress/scenarios:/scripts:ro
    environment:
      - TARGETS=${TARGETS:-go,java}
      - USE_DATABASE=${USE_DATABASE:-false}
      - VUS=${VUS:-20}
      - MODE=${MODE:-requests}
      - DURATION=${DURATION:-30s}
      - REQUESTS=${REQUESTS:-10000}
      - PUSHGATEWAY_URL=${PUSHGATEWAY_URL:-http://pushgateway:9091}
    command: ["run", "/scripts/data.js"]
    logging: *default-logging
