server:
  port: ${PORT:8081}

spring:
  application:
    name: java-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USER:apidatatest}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # El pool se configura por entorno para que Go y Java midan en igualdad.
      maximum-pool-size: ${DB_MAX_OPEN_CONNS:10}
      minimum-idle: ${DB_MAX_IDLE_CONNS:10}
      # Permite arrancar sin base: /data?useDatabase=true responderá 503.
      initialization-fail-timeout: -1

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      # Expone las métricas en /metrics, igual que el servicio Go.
      path-mapping:
        prometheus: metrics
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: java-service
